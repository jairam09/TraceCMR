# A beta tester's first session on a clean Windows PC and a clean Mac, start to finish: get the installer, install
# it the way a user does, then open TraceCMR and run scripts/walkthrough.py: the first-run tour, opening a test mouse
# (downloaded from Drive), results, per-slice ED/ES Detect, ED | ES, saving a figure, the Wall tab, Export all,
# Save, then Auto LV (ready out of the box from 0.3.5) and a run. Then patch updates: through the window on the Mac (the card appears,
# Update, Restart now, TraceCMR reopens on the new version), and headless on both (a broken patch is rolled back,
# a good one installs, one that needs new packages is refused). Screenshots go to the branch walkthrough/<os>.
#
# Where the installer comes from:
#   - the release workflow calls this with this_run: the installers it just built (nothing is published unless
#     this passes)
#   - Actions -> "walkthrough" -> "Run workflow": from Google Drive (file IDs), or from an "installers" run (from_run)

name: walkthrough

on:
  workflow_dispatch:
    inputs:
      windows_id:
        description: Drive file ID of the Windows installer
        default: 1rpYihznncmLtifB0-mUTj7Vulu8SiwJR
      mac_id:
        description: Drive file ID of the macOS installer
        default: 1uTSyuDHCRBPl0MAF6H8FGhWVK2vEXVf5
      mouse_id:
        description: Drive file ID of the test mouse (Mouse1.h5)
        default: 1JcuvxNT-8VfBdM8WBT-mquSCxJMGJ-9-
      from_run:
        description: Test the installers from this "installers" run instead of Drive (run ID; blank = Drive)
        default: ""
  workflow_call:
    inputs:
      this_run:
        description: Test the installers and wheel built earlier in the calling run (the release workflow)
        type: boolean
        default: true
      mouse_id:
        type: string
        default: 1JcuvxNT-8VfBdM8WBT-mquSCxJMGJ-9-
      windows_id:
        type: string
        default: ""
      mac_id:
        type: string
        default: ""
      from_run:
        type: string
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  tester:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            ext: exe
            artifact: TraceCMR-windows
          - os: macos-latest
            label: macos
            ext: pkg
            artifact: TraceCMR-macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      MOUSE_ID: ${{ inputs.mouse_id || '1JcuvxNT-8VfBdM8WBT-mquSCxJMGJ-9-' }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer built earlier in this run
        if: inputs.this_run
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: built

      - name: Release wheel built earlier in this run
        if: inputs.this_run
        uses: actions/download-artifact@v4
        with:
          name: tracecmr-wheel
          path: wheel

      - name: Installer from an "installers" run
        if: inputs.from_run != '' && !inputs.this_run
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: built
          run-id: ${{ inputs.from_run }}
          github-token: ${{ github.token }}

      - name: Get the installer and a test mouse
        run: |
          note() { printf '::%s title=%s::%s\n' "$1" "$2" "$(printf '%s' "$3" | sed -e 's/%/%25/g' | tr '\r' ' ' | awk 'BEGIN{ORS="%0A"}1')"; }
          if [ -d built ]; then
            f=$(ls built/*.${{ matrix.ext }} | head -1); cp "$f" "TraceCMR-installer.${{ matrix.ext }}"
            note notice "installer" "built in GitHub: $(basename "$f") $(wc -c < "$f") bytes"
          else
            id=${{ matrix.label == 'windows' && inputs.windows_id || inputs.mac_id }}
            # what the beta page's link does: for a large file Drive answers with its "can't scan for viruses" page
            curl -sSL -o first.html "https://drive.google.com/uc?export=download&id=$id"
            note notice "page link answers with" "$(grep -o '<title>[^<]*' first.html | head -1); $(grep -o 'Download anyway' first.html | head -1)"
            start=$(date +%s)
            curl -sSL -o "TraceCMR-installer.${{ matrix.ext }}" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
            note notice "installer download" "$(wc -c < TraceCMR-installer.${{ matrix.ext }}) bytes in $(( $(date +%s) - start )) s"
          fi
          size=$(wc -c < "TraceCMR-installer.${{ matrix.ext }}")
          [ "$size" -gt 200000000 ] || { note error "download" "installer too small: $size bytes"; exit 1; }
          curl -sSL -o Mouse1.h5 "https://drive.usercontent.google.com/download?id=$MOUSE_ID&export=download&confirm=t"
          msize=$(wc -c < Mouse1.h5)
          note notice "test mouse download" "$msize bytes"
          [ "$msize" -gt 10000000 ] || { note error "download" "Mouse1.h5 too small"; exit 1; }

      - name: Install (Windows, as a user would)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $t = Get-Date
          Start-Process -Wait -FilePath ".\TraceCMR-installer.exe" -ArgumentList "/InstallationType=JustMe","/RegisterPython=0","/S","/D=$env:USERPROFILE\TraceCMR"
          $secs = [int]((Get-Date) - $t).TotalSeconds
          $log = Get-Content "$env:USERPROFILE\TraceCMR\install_log.txt" -Raw
          Write-Output $log
          $desk = [Environment]::GetFolderPath('Desktop'); $progs = [Environment]::GetFolderPath('Programs')
          $lines = ($log -replace "`r","" -split "`n" | Where-Object { $_ -cmatch 'shortcut|INSTALL OK|PACKAGES OK|WARMUP|FAIL|failed|Error' }) -join ' | '
          Write-Output "::notice title=Windows install::$secs s | Desktop $desk lnk: $(Test-Path "$desk\TraceCMR.lnk") | Start menu $progs lnk: $(Test-Path "$progs\TraceCMR.lnk") | $lines"
          Copy-Item "$env:USERPROFILE\TraceCMR\install_log.txt" install_log.txt
          Get-ChildItem "$env:USERPROFILE\TraceCMR" | Select-Object Name, Length | Out-File prefix_listing.txt
          if ($log -notmatch "INSTALL OK") { Write-Output "::error title=install::INSTALL OK not found"; exit 1 }
          "PY=$env:USERPROFILE\TraceCMR\python.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install (macOS, as a user would)
        if: runner.os == 'macOS'
        run: |
          note() { printf '::%s title=%s::%s\n' "$1" "$2" "$(printf '%s' "$3" | sed -e 's/%/%25/g' | tr '\r' ' ' | awk 'BEGIN{ORS="%0A"}1')"; }
          start=$(date +%s)
          installer -pkg TraceCMR-installer.pkg -target CurrentUserHomeDirectory > inst.txt 2>&1 || sudo installer -pkg TraceCMR-installer.pkg -target / >> inst.txt 2>&1
          secs=$(( $(date +%s) - start ))
          prefix=""
          for d in "$HOME/TraceCMR" /Applications/TraceCMR /opt/TraceCMR /var/root/TraceCMR; do [ -d "$d" ] && { prefix="$d"; break; }; done
          note notice "macOS install" "$secs s; prefix ${prefix:-not found}; app: $(ls -d "$HOME/Applications/TraceCMR.app" 2>&1); owner: $(stat -f %Su "$prefix" 2>&1); $(sudo grep -E 'OK|DONE|FAIL' "$prefix/install_log.txt" 2>&1 | tr '\n' ' ')"
          sudo grep -q "INSTALL OK" "$prefix/install_log.txt" || { note error "install" "INSTALL OK not found: $(tail -c 1500 inst.txt)"; exit 1; }
          sudo cp "$prefix/install_log.txt" install_log.txt; sudo chmod a+r install_log.txt
          echo "PY=$prefix/bin/python" >> "$GITHUB_ENV"

      - name: First session (walkthrough)
        id: walk
        # Windows runners have no OpenGL, so the window can't open there; the Mac run is the one that counts
        continue-on-error: ${{ matrix.label == 'windows' }}
        run: |
          set +e
          # installers built from this code include the model: Auto LV must work without any setup
          export TRACECMR_WALK_EXPECT_READY=${{ (inputs.this_run || inputs.from_run != '') && '1' || '' }}
          "$PY" scripts/walkthrough.py Mouse1.h5 shots > walk.txt 2>&1; rc=$?
          cat walk.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Auto LV out of the box, its accuracy, and the one-click setup older installs get (headless)
        id: auto
        if: always() && env.PY != ''
        run: |
          note() { printf '::%s title=%s::%s\n' "$1" "$2" "$(printf '%s' "$3" | sed -e 's/%/%25/g' | tr '\r' ' ' | awk 'BEGIN{ORS="%0A"}1')"; }
          set +e
          start=$(date +%s)
          "$PY" scripts/check_autocontour.py Mouse1.h5 autocontour.json ${{ (inputs.this_run || inputs.from_run != '') && '--expect-bundled' || '' }} > auto.txt 2>&1; rc=$?
          cat auto.txt
          note notice "auto-contour (${{ matrix.label }}), $(( $(date +%s) - start )) s, exit $rc" "$(grep -v '^ *\"steps\"' auto.txt | tail -n 30 | cut -c1-200)"
          exit $rc

      - name: Test patches (pretend releases made from the release wheel)
        id: patches
        if: always() && env.PY != ''
        run: |
          note() { printf '::%s title=%s::%s\n' "$1" "$2" "$(printf '%s' "$3" | sed -e 's/%/%25/g' | tr '\r' ' ' | awk 'BEGIN{ORS="%0A"}1')"; }
          if ! "$PY" -c "import tracecmr.updater"; then note notice "updates" "this installer predates patch updates: skipped"; exit 0; fi
          if [ ! -d wheel ]; then python3 -m pip wheel -q --no-deps -w wheel . || python -m pip wheel -q --no-deps -w wheel . ; fi
          base=$(ls wheel/*.whl | head -1)
          read -r next broken good needs < <("$PY" -c "import tracecmr as t; a,b,c=(int(x) for x in t.__version__.split('.')[:3]); print(f'{a}.{b}.{c+1} {a}.{b}.98 {a}.{b}.99 {a}.{b+1}.0')" | tr -d '\r')
          "$PY" scripts/make_test_patches.py "$base" patches_gui "$next"
          "$PY" scripts/make_test_patches.py "$base" patches "$broken:broken" "$good" "$needs:needs"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "ready=1" >> "$GITHUB_OUTPUT"
          note notice "test patches" "from $(basename "$base"): window $next; headless $broken (broken), $good, $needs (needs new packages)"

      - name: Patch update through the window (macOS)
        if: always() && runner.os == 'macOS' && steps.patches.outputs.ready == '1'
        run: |
          note() { printf '::%s title=%s::%s\n' "$1" "$2" "$(printf '%s' "$3" | sed -e 's/%/%25/g' | tr '\r' ' ' | awk 'BEGIN{ORS="%0A"}1')"; }
          set +e
          next=${{ steps.patches.outputs.next }}
          before=$("$PY" -c "import tracecmr; print(tracecmr.__version__)")
          U="$HOME/.tracecmr/updates"
          "$PY" scripts/check_update_gui.py "patches_gui/latest-$next.json" Mouse1.h5 shots > update_gui.txt 2>&1; rc=$?
          cat update_gui.txt
          [ $rc -eq 0 ] || { note error "update (window)" "the window part failed: $(tail -c 2500 update_gui.txt)"; exit 1; }
          # the helper installs, then reopens TraceCMR, which reads the result (and renames the file) at start
          for i in $(seq 1 150); do [ -f "$U/last_update.shown.json" ] && break; sleep 2; done
          sleep 8
          screencapture -x shots/update_3_reopened_screen.png 2>/dev/null & sleep 6
          pkill -f tracecmr-app; pkill -f "tracecmr.app"; sleep 2
          after=$("$PY" -c "import tracecmr; print(tracecmr.__version__)")
          res=$(cat "$U/last_update.shown.json" "$U/last_update.json" 2>/dev/null)
          cp "$HOME/Documents/TraceCMR results/logs/update_log.txt" update_log.txt 2>/dev/null
          note notice "update through the window" "before $before, after $after; reopened and read the result: $([ -f "$U/last_update.shown.json" ] && echo yes || echo NO); $res"
          [ "$after" = "$next" ] || { note error "update (window)" "TraceCMR is $after, expected $next: $(tail -c 2500 update_log.txt)"; exit 1; }
          [ -f "$U/last_update.shown.json" ] || { note error "update (window)" "the reopened TraceCMR never read the result (did it reopen?)"; exit 1; }

      - name: Patch updates, headless (broken rolled back, good installed, new packages refused)
        if: always() && steps.patches.outputs.ready == '1'
        run: |
          note() { printf '::%s title=%s::%s\n' "$1" "$2" "$(printf '%s' "$3" | sed -e 's/%/%25/g' | tr '\r' ' ' | awk 'BEGIN{ORS="%0A"}1')"; }
          set +e
          "$PY" scripts/check_update.py patches update_report.json > update.txt 2>&1; rc=$?
          cat update.txt
          cp "$HOME/Documents/TraceCMR results/logs/update_log.txt" update_log.txt 2>/dev/null
          note notice "patch updates headless (${{ matrix.label }}), exit $rc" "$(grep -E '^(OK|FAIL)|^\{' update.txt | cut -c1-300)"
          exit $rc

      - name: Report
        if: always()
        run: |
          note() { printf '::%s title=%s::%s\n' "$1" "$2" "$(printf '%s' "$3" | sed -e 's/%/%25/g' | tr '\r' ' ' | awk 'BEGIN{ORS="%0A"}1')"; }
          note notice "walkthrough output" "$(grep -E '^(OK|FAIL)|^\{' walk.txt 2>/dev/null | cut -c1-300 | tail -n 40)"
          [ -f shots/summary.json ] || note warning "walkthrough" "no summary: $(tail -c 3000 walk.txt 2>/dev/null)"

      - name: Push screenshots to branch walkthrough/${{ matrix.label }}
        if: always()
        continue-on-error: true  # bookkeeping: never marks the test itself as failed
        run: |
          note() { printf '::%s title=%s::%s\n' "$1" "$2" "$(printf '%s' "$3" | sed -e 's/%/%25/g' | tr '\r' ' ' | awk 'BEGIN{ORS="%0A"}1')"; }
          set +e
          mkdir -p out
          cp -R shots/. out/ 2>/dev/null
          for f in walk*.txt install_log.txt prefix_listing.txt auto.txt autocontour.json update*.txt update*.json update_log.txt; do
            [ -f "$f" ] && cp "$f" out/
          done
          cd out || exit 0
          git init -q -b "walkthrough/${{ matrix.label }}"
          git config user.name "walkthrough bot"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Walkthrough ${{ matrix.label }} $(date -u +%FT%TZ)" || exit 0
          msg=$(git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/walkthrough/${{ matrix.label }}" 2>&1) \
            || { note warning "screenshots not pushed" "$msg"; exit 1; }
          note notice "screenshots" "branch walkthrough/${{ matrix.label }}: $(ls | wc -l | tr -d ' ') files"
