[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-cmr-pipeline"
version = "0.1.1"
description = "Open-source analysis pipeline for mouse cardiac MRI: volumes, regional wall thickness, and LGE scar"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
    "nibabel>=5.0",
    "h5py>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter"]
bruker = ["brukerapi"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
