[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecmr"
version = "0.3.5"
description = "TraceCMR: open-source analysis for mouse cardiac MRI (volumes, regional wall thickness, LGE scar)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jaikrishnan Ram" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
    "nibabel>=5.0",
    "h5py>=3.8",
    "pydicom>=2.4",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter"]
bruker = ["brukerapi"]
app = ["napari[pyqt6]>=0.5", "qtawesome>=1.3"]
# runs the bundled Auto LV model; the installers include it, older installs get it from the one-click setup
auto = ["onnxruntime>=1.20,<2"]

[project.scripts]
tracecmr = "tracecmr.app.launch:main"

[project.gui-scripts]
# the desktop app: same program, but Windows opens no console window for it
tracecmr-app = "tracecmr.app.launch:main"

[project.entry-points."napari.manifest"]
tracecmr = "tracecmr.app:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tracecmr.app" = ["napari.yaml", "resources/*.png", "resources/*.ico", "resources/*.svg", "resources/fonts/*"]
"tracecmr" = ["ucl_model.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
