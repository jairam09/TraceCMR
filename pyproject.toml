[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ventrimap"
version = "0.3.0"
description = "VentriMap: open-source analysis for mouse cardiac MRI (volumes, regional wall thickness, LGE scar)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jaikrishnan Ram" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
    "nibabel>=5.0",
    "h5py>=3.8",
    "pydicom>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter"]
bruker = ["brukerapi"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
